<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | GfxPrints</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2438E0">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#F2F0EA;color:#15171B;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  main{max-width:440px}
  .code{font-size:5rem;font-weight:800;line-height:1;color:#2438E0;margin:0}
  h1{font-size:1.5rem;margin:12px 0 8px}
  p{margin:0 0 24px;color:#4A4B4E;line-height:1.5}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a{display:inline-block;padding:12px 20px;border-radius:10px;font-weight:700;text-decoration:none;border:2px solid #15171B;color:#15171B;background:#fff}
  a.primary{background:#2438E0;border-color:#2438E0;color:#fff}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>We couldn't find that page</h1>
  <p>The link may be old or mistyped. Head back to the shop and design something you love.</p>
  <div class="row">
    <a class="primary" id="go-shop" href="shop.html">Browse the shop</a>
    <a id="go-home" href="index.html">Back to home</a>
  </div>
</main>
<script>
  /* On a GitHub project site the root is /repo-name/, otherwise it is /. */
  (function(){
    var base = "/";
    if (/\.github\.io$/.test(location.hostname)){
      var seg = location.pathname.split("/")[1];
      if (seg) base = "/" + seg + "/";
    }
    document.getElementById("go-shop").href = base + "shop.html";
    document.getElementById("go-home").href = base + "index.html";
  })();
</script>
</body>
</html>
